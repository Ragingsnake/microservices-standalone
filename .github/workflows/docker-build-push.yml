name: Build and Push Docker Images

on:
  push:
    paths:
      - 'src/**'

  pull_request:
    paths:
      - 'src/**'

  workflow_dispatch:
    inputs:
      build_all_images:
        description: "Build every image instead of only changed ones"
        required: false
        default: "true"
      image_tag:
        description: "Optional tag override, for example v2-good or v2-bad. Leave empty to use the normal SHA and latest tags."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.matrix.outputs.should_build }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute changed services
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          declare -A context_map=(
            [adservice]="src/adservice"
            [cartservice]="src/cartservice/src"
            [checkoutservice]="src/checkoutservice"
            [currencyservice]="src/currencyservice"
            [emailservice]="src/emailservice"
            [frontend]="src/frontend"
            [loadgenerator]="src/loadgenerator"
            [paymentservice]="src/paymentservice"
            [productcatalogservice]="src/productcatalogservice"
            [recommendationservice]="src/recommendationservice"
            [shippingservice]="src/shippingservice"
            [shoppingassistantservice]="src/shoppingassistantservice"
          )

          declare -A dockerfile_map=(
            [cartservice]="src/cartservice/src/Dockerfile"
          )

          all_services=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
            shoppingassistantservice
          )

          services=()

          if [ "${{ github.event.inputs.build_all_images }}" = "true" ]; then
            services=("${all_services[@]}")
          else
            echo "Detecting changed files vs origin/main to build only affected images"
            # Ensure we have the main branch reference
            git fetch origin main --depth=1 || true

            BASE_REF="origin/main"
            echo "Using base ref: $BASE_REF"
            changed_files=$(git diff --name-only $BASE_REF...HEAD || true)
            echo "Changed files:\n$changed_files"

            if [ -z "$changed_files" ]; then
              echo "No relevant source changes detected. Exiting without build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            for service in "${all_services[@]}"; do
              context="${context_map[$service]}"
              dockerfile="${dockerfile_map[$service]:-$context/Dockerfile}"

              # If any changed file is under the service context or equals the Dockerfile path,
              # include the service in the build list.
              if echo "$changed_files" | grep -qE "^${context}/|^${dockerfile}$"; then
                services+=("$service")
              fi
            done
          fi

          declare -A seen=()
          unique_services=()
          for service in "${services[@]}"; do
            if [ -z "${seen[$service]+x}" ]; then
              seen[$service]=1
              unique_services+=("$service")
            fi
          done

          if [ "${#unique_services[@]}" -eq 0 ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix='{"include":['
          separator=''
          for service in "${unique_services[@]}"; do
            context="${context_map[$service]}"
            dockerfile="${dockerfile_map[$service]:-$context/Dockerfile}"
            matrix+="${separator}{\"service\":\"${service}\",\"context\":\"${context}\",\"dockerfile\":\"${dockerfile}\"}"
            separator=','
          done
          matrix+=']}'

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    env:
      DOCKERHUB_USERNAME: ragingsnake
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          image="docker.io/${DOCKERHUB_USERNAME}/${{ matrix.service }}"
          override_tag='${{ github.event.inputs.image_tag }}'

          if [ -n "$override_tag" ]; then
            tags="${image}:${override_tag}"
          else
            tags="${image}:${GITHUB_SHA}"

            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              tags="${tags}"$'\n'"${image}:latest"
            fi
          fi

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%b\n' "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Built and pushed ${{ matrix.service }} to docker.io/${DOCKERHUB_USERNAME}/${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "First successful push creates the Docker Hub repository if it does not already exist." >> "$GITHUB_STEP_SUMMARY"
