name: setup istio

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  setup-istio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: Install istioctl
        shell: bash
        run: |
          set -euo pipefail
          curl -L https://istio.io/downloadIstio | sh -
          sudo mv istio-*/bin/istioctl /usr/local/bin/istioctl
          istioctl version --remote=false

      - name: Install Istio demo profile
        id: istio-install
        shell: bash
        run: |
          set -euo pipefail
          if kubectl -n istio-system get deployment istiod >/dev/null 2>&1; then
            echo "istio already installed; skipping istioctl install"
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          istioctl install --set profile=demo -y
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for Istio control plane
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n istio-system wait --for=condition=available deployment/istiod --timeout=15m
          kubectl -n istio-system get pods,svc

      - name: Label application namespace for injection
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace onlineboutique --dry-run=client -o yaml | kubectl apply -f -
          # Istio 1.x uses revision-based injection (demo profile -> revision "default").
          kubectl label namespace onlineboutique istio.io/rev=default --overwrite
          kubectl label namespace onlineboutique istio-injection- 2>/dev/null || true
          kubectl get namespace onlineboutique --show-labels

      - name: Summarize Istio access
        run: |
          echo "## Istio Result" >> "$GITHUB_STEP_SUMMARY"
          echo "Istio control plane installed with demo profile." >> "$GITHUB_STEP_SUMMARY"
          echo "Namespace labeled for injection: onlineboutique" >> "$GITHUB_STEP_SUMMARY"
          echo "Istio install ran: ${{ steps.istio-install.outputs.installed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Check: kubectl get pods -n istio-system; kubectl get ns onlineboutique --show-labels; kubectl get pods -n onlineboutique" >> "$GITHUB_STEP_SUMMARY"
