name: inspect prometheus

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Namespace to inspect"
        required: false
        default: "onlineboutique"

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: Inspect Prometheus and Istio metrics
        shell: bash
        run: |
          set -euo pipefail

          APP_NS="${{ inputs.namespace }}"

          echo "=== Monitoring namespace ==="
          kubectl -n monitoring get deploy,pod,svc || true

          echo "=== Prometheus selector summary ==="
          kubectl -n monitoring get prometheus monitoring-kube-prometheus-prometheus -o json \
            | jq -c '{
                serviceMonitorSelector: .spec.serviceMonitorSelector,
                serviceMonitorNamespaceSelector: .spec.serviceMonitorNamespaceSelector,
                podMonitorSelector: .spec.podMonitorSelector,
                podMonitorNamespaceSelector: .spec.podMonitorNamespaceSelector
              }' || echo "Prometheus custom resource not found"

          echo "=== ServiceMonitor: istio-ingressgateway (istio-system) ==="
          kubectl -n istio-system get servicemonitor istio-ingressgateway -o yaml || echo "ServiceMonitor istio-ingressgateway not found in istio-system"

          echo "=== PodMonitor: istio-ingressgateway (istio-system) ==="
          kubectl -n istio-system get podmonitor istio-ingressgateway -o yaml || echo "PodMonitor istio-ingressgateway not found in istio-system"

          echo "=== istio-ingressgateway pod ports ==="
          kubectl -n istio-system get pods -l istio=ingressgateway -o json \
            | jq -c '.items[]? | {
                pod: .metadata.name,
                labels: .metadata.labels,
                ports: [
                  .spec.containers[]? | {
                    container: .name,
                    ports: [
                      .ports[]? | {name, containerPort, protocol}
                    ]
                  }
                ]
              }'

          echo "=== Prometheus readiness and API checks ==="
          if kubectl -n monitoring get svc monitoring-kube-prometheus-prometheus >/dev/null 2>&1; then
            kubectl -n monitoring port-forward svc/monitoring-kube-prometheus-prometheus 9090:9090 >/tmp/prom-pf.log 2>&1 &
            PF_PID=$!

            PROM_READY=false
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:9090/-/ready >/dev/null 2>&1; then
                PROM_READY=true
                break
              fi
              echo "Waiting for Prometheus port-forward to become ready... ($i/30)"
              sleep 2
            done

            if [ "$PROM_READY" != "true" ]; then
              echo "Prometheus port-forward did not become ready in time. Port-forward log:"
              cat /tmp/prom-pf.log || true
            fi

            echo "--- Prometheus ingressgateway scrape summary ---"
            INGRESS_TARGET=$(curl -sS --fail http://localhost:9090/api/v1/targets \
              | jq -c '
                  .data.activeTargets[]?
                  | select(((.discoveredLabels.__meta_kubernetes_service_name // "") == "istio-ingressgateway") or ((.labels.job // "") | test("(serviceMonitor|podMonitor)/.*istio-ingressgateway"; "i")))
                  | {
                      service: (.discoveredLabels.__meta_kubernetes_service_name // .labels.job // "unknown"),
                      endpoint: (.discoveredLabels.__meta_kubernetes_endpoints_name // "unknown"),
                      pod: (.discoveredLabels.__meta_kubernetes_pod_name // "unknown"),
                      scrapeUrl,
                      health,
                      lastScrape,
                      lastError
                    }')
            if [ -n "$INGRESS_TARGET" ]; then
              echo "$INGRESS_TARGET"
            else
              echo "No active scrape target found for istio-ingressgateway"
            fi

            echo "--- Prometheus ingressgateway dropped scrape summary ---"
            DROPPED_INGRESS_TARGET=$(curl -sS --fail 'http://localhost:9090/api/v1/targets?state=dropped' \
              | jq -c '
                  .data.droppedTargets[]?
                  | select(((.discoveredLabels.__meta_kubernetes_service_name // "") == "istio-ingressgateway") or ((.labels.job // "") | test("(serviceMonitor|podMonitor)/.*istio-ingressgateway"; "i")))
                  | {
                      service: (.discoveredLabels.__meta_kubernetes_service_name // .labels.job // "unknown"),
                      endpoint: (.discoveredLabels.__meta_kubernetes_endpoints_name // "unknown"),
                      pod: (.discoveredLabels.__meta_kubernetes_pod_name // "unknown"),
                      address: (.discoveredLabels.__address__ // "unknown"),
                      endpointPort: (.discoveredLabels.__meta_kubernetes_endpoint_port_name // .discoveredLabels.__meta_kubernetes_pod_container_port_name // "unknown"),
                      metricsPath: (.discoveredLabels.__metrics_path__ // "unknown"),
                      job: (.labels.job // .discoveredLabels.job // "unknown"),
                      scrapeUrl: (.scrapeUrl // "unknown"),
                      health: (.health // "unknown"),
                      lastScrape: (.lastScrape // "unknown"),
                      lastError: (.lastError // "unknown")
                    }')
            if [ -n "$DROPPED_INGRESS_TARGET" ]; then
              echo "$DROPPED_INGRESS_TARGET"
            else
              echo "No dropped scrape target found for istio-ingressgateway"
            fi

            echo "--- Prometheus rendered scrape config checks ---"
            RENDERED_INGRESS_JOBS=$(curl -sS --fail http://localhost:9090/api/v1/status/config \
              | jq -r '.data.yaml' \
              | awk '
                  BEGIN { in_job = 0; job = ""; found = 0 }
                  /^- job_name: / { job = $0; in_job = 1 }
                  in_job && /podMonitor\/istio-system\/istio-ingressgateway/ { print job; print; found = 1 }
                  in_job && /serviceMonitor\/istio-system\/istio-ingressgateway/ { print job; print; found = 1 }
                  END { if (!found) print "No rendered podMonitor/serviceMonitor job found for istio-ingressgateway" }
                '
            )
            echo "$RENDERED_INGRESS_JOBS"

            echo "--- Prometheus rendered podMonitor job block ---"
            curl -sS --fail http://localhost:9090/api/v1/status/config \
              | jq -r '.data.yaml' \
              | awk '
                  /^- job_name: podMonitor\/istio-system\/istio-ingressgateway\/0$/ { print; show = 1; n = 0; next }
                  show { print; n += 1 }
                  n >= 40 { exit }
                '

            echo "--- Prometheus rendered serviceMonitor job block ---"
            curl -sS --fail http://localhost:9090/api/v1/status/config \
              | jq -r '.data.yaml' \
              | awk '
                  /^- job_name: serviceMonitor\/istio-system\/istio-ingressgateway\/0$/ { print; show = 1; n = 0; next }
                  show { print; n += 1 }
                  n >= 40 { exit }
                '

            echo "--- Prometheus exact podMonitor target probe ---"
            curl -sS --fail http://localhost:9090/api/v1/targets \
              | jq -c '
                  .data.activeTargets[]?
                  | select((.labels.job // "") == "podMonitor/istio-system/istio-ingressgateway/0")
                  | {job: .labels.job, scrapeUrl, health, lastScrape, lastError, labels: .labels, discoveredLabels: .discoveredLabels}
                ' || echo "No active target for podMonitor/istio-system/istio-ingressgateway/0"

            echo "--- Prometheus exact podMonitor dropped target probe ---"
            curl -sS --fail 'http://localhost:9090/api/v1/targets?state=dropped' \
              | jq -c '
                  .data.droppedTargets[]?
                  | select((.labels.job // .discoveredLabels.job // "") == "podMonitor/istio-system/istio-ingressgateway/0")
                  | {job: (.labels.job // .discoveredLabels.job // "unknown"), scrapeUrl: (.scrapeUrl // "unknown"), health: (.health // "unknown"), lastScrape: (.lastScrape // "unknown"), lastError: (.lastError // "unknown"), discoveredLabels: .discoveredLabels}
                ' || echo "No dropped target for podMonitor/istio-system/istio-ingressgateway/0"

            echo "--- Prometheus podMonitor job summary ---"
            PODMONITOR_TARGETS=$(curl -sS --fail http://localhost:9090/api/v1/targets \
              | jq -c '.data.activeTargets[]? | select((.labels.job // "") | test("podMonitor"; "i")) | {job: .labels.job, scrapeUrl, health, lastScrape, lastError}')
            if [ -n "$PODMONITOR_TARGETS" ]; then
              echo "$PODMONITOR_TARGETS"
            else
              echo "No active podMonitor targets found"
            fi

            echo "--- Prometheus podMonitor dropped target summary ---"
            DROPPED_PODMONITOR_TARGETS=$(curl -sS --fail 'http://localhost:9090/api/v1/targets?state=dropped' \
              | jq -c '.data.droppedTargets[]? | select((.labels.job // "") | test("podMonitor"; "i")) | {job: .labels.job, scrapeUrl: (.scrapeUrl // "unknown"), health: (.health // "unknown"), lastScrape: (.lastScrape // "unknown"), lastError: (.lastError // "unknown"), discoveredLabels: .discoveredLabels}')
            if [ -n "$DROPPED_PODMONITOR_TARGETS" ]; then
              echo "$DROPPED_PODMONITOR_TARGETS"
            else
              echo "No dropped podMonitor targets found"
            fi

            kill $PF_PID || true
            sleep 1
          else
            echo "Prometheus service monitoring-kube-prometheus-prometheus not found in monitoring namespace"
          fi

      - name: Summarize inspection results
        run: |
          echo "## Prometheus Inspection" >> "$GITHUB_STEP_SUMMARY"
          echo "Namespace inspected: ${{ inputs.namespace }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the ingressgateway scrape summary output from the job logs above." >> "$GITHUB_STEP_SUMMARY"
