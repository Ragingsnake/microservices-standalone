name: inspect prometheus

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Namespace to inspect"
        required: false
        default: "onlineboutique"

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: Inspect Prometheus and Istio metrics
        shell: bash
        run: |
          set -euo pipefail

          APP_NS="${{ inputs.namespace }}"

          echo "=== Monitoring namespace ==="
          kubectl -n monitoring get deploy,pod,svc || true

          echo "=== Prometheus selector summary ==="
          kubectl -n monitoring get prometheus monitoring-kube-prometheus-prometheus -o json \
            | jq -c '{
                serviceMonitorSelector: .spec.serviceMonitorSelector,
                serviceMonitorNamespaceSelector: .spec.serviceMonitorNamespaceSelector,
                podMonitorSelector: .spec.podMonitorSelector,
                podMonitorNamespaceSelector: .spec.podMonitorNamespaceSelector
              }' || echo "Prometheus custom resource not found"

          echo "=== PodMonitor: istio-ingressgateway (istio-system) ==="
          kubectl -n istio-system get podmonitor istio-ingressgateway -o yaml || echo "PodMonitor istio-ingressgateway not found in istio-system"

          echo "=== istio-ingressgateway pod ports ==="
          kubectl -n istio-system get pods -l istio=ingressgateway -o json \
            | jq -c '.items[]? | {
                pod: .metadata.name,
                labels: .metadata.labels,
                ports: [
                  .spec.containers[]? | {
                    container: .name,
                    ports: [
                      .ports[]? | {name, containerPort, protocol}
                    ]
                  }
                ]
              }'

          echo "=== istio-ingressgateway port summary ==="
          kubectl -n istio-system get pods -l istio=ingressgateway -o json \
            | jq -c '.items[]? | {
                pod: .metadata.name,
                has15090: ([.spec.containers[]?.ports[]? | select(.containerPort == 15090)] | length > 0),
                matchingPorts: [.spec.containers[]?.ports[]? | select(.containerPort == 15090 or .name == "http-envoy-prom") | {containerPort, name, protocol}]
              }'

          echo "=== frontend pod injection state ==="
          kubectl -n "$APP_NS" get pods -l app=frontend -o json \
            | jq -c '.items[]? | {
                pod: .metadata.name,
                revision: (.metadata.labels["istio.io/rev"] // "none"),
                sidecarInjected: ([.spec.containers[]?.name] | index("istio-proxy") != null),
                containers: [.spec.containers[]?.name],
                containerPorts: [.spec.containers[]? | {name, ports: [.ports[]? | {name, containerPort, protocol}]}]
              }'

          echo "=== frontend rollout status ==="
          kubectl -n "$APP_NS" rollout status deployment/frontend --timeout=2m || true

          echo "=== istio-system ingress revision summary ==="
          kubectl -n istio-system get pods -l istio=ingressgateway -o json \
            | jq -c '.items[]? | {
                pod: .metadata.name,
                revision: (.metadata.labels["istio.io/rev"] // "none"),
                release: (.metadata.labels.release // "none"),
                sidecarInjected: ([.spec.containers[]?.name] | index("istio-proxy") != null)
              }'

          echo "=== Flagger canary status ==="
          kubectl -n "$APP_NS" get canary frontend -o json \
            | jq -c '{
                name: .metadata.name,
                namespace: .metadata.namespace,
                phase: (.status.phase // "unknown"),
                weight: (.status.canaryWeight // 0),
                failedChecks: (.status.failedChecks // 0),
                iterations: (.status.iterations // 0),
                conditions: (.status.conditions // []),
                lastAppliedSpec: (.status.lastAppliedSpec // {}),
                lastTransitionTime: ((.status.conditions // [] | map(select(.status == "True") | .lastTransitionTime) | last) // "unknown")
              }' || echo "Frontend canary not found"

          echo "=== Flagger canary events ==="
          kubectl -n "$APP_NS" get events --sort-by=.lastTimestamp \
            --field-selector involvedObject.kind=Canary,involvedObject.name=frontend \
            -o json \
            | jq -r '.items[]? | [(.lastTimestamp // .eventTime // "unknown"), (.type // "unknown"), (.reason // "unknown"), (.message // "")] | @tsv' \
            || echo "No canary events found"

          echo "=== Prometheus readiness and API checks ==="
          if kubectl -n monitoring get svc monitoring-kube-prometheus-prometheus >/dev/null 2>&1; then
            kubectl -n monitoring port-forward svc/monitoring-kube-prometheus-prometheus 9090:9090 >/tmp/prom-pf.log 2>&1 &
            PF_PID=$!

            PROM_READY=false
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:9090/-/ready >/dev/null 2>&1; then
                PROM_READY=true
                break
              fi
              echo "Waiting for Prometheus port-forward to become ready... ($i/30)"
              sleep 2
            done

            if [ "$PROM_READY" != "true" ]; then
              echo "Prometheus port-forward did not become ready in time. Port-forward log:"
              cat /tmp/prom-pf.log || true
            fi

            echo "--- Prometheus ingressgateway scrape summary ---"
            INGRESS_TARGET=$(curl -sS --fail http://localhost:9090/api/v1/targets \
              | jq -c '
                  .data.activeTargets[]?
                  | select(
                      (.labels.job // "") == "istio-system/istio-ingressgateway"
                      or ((.discoveredLabels.__meta_kubernetes_pod_label_app // "") == "istio-ingressgateway"
                          and ((.discoveredLabels.__address__ // "") | endswith(":15090")))
                    )
                  | {
                      job: (.labels.job // "unknown"),
                      pod: (.discoveredLabels.__meta_kubernetes_pod_name // "unknown"),
                      address: (.discoveredLabels.__address__ // "unknown"),
                      scrapeUrl,
                      health,
                      lastScrape,
                      lastError
                    }')
            if [ -n "$INGRESS_TARGET" ]; then
              echo "$INGRESS_TARGET"
            else
              echo "No active scrape target found for istio-ingressgateway"
            fi

            echo "--- Prometheus ingressgateway dropped scrape summary ---"
            DROPPED_INGRESS_TARGET=$(curl -sS --fail 'http://localhost:9090/api/v1/targets?state=dropped' \
              | jq -c '
                  .data.droppedTargets[]?
                  | select((.discoveredLabels.job // .labels.job // "") | test("istio-system/istio-ingressgateway"; "i"))
                  | {
                      job: (.labels.job // .discoveredLabels.job // "unknown"),
                      pod: (.discoveredLabels.__meta_kubernetes_pod_name // "unknown"),
                      address: (.discoveredLabels.__address__ // "unknown"),
                      endpointPort: (.discoveredLabels.__meta_kubernetes_pod_container_port_name // "unknown"),
                      metricsPath: (.discoveredLabels.__metrics_path__ // "unknown"),
                      scrapeUrl: (.scrapeUrl // "unknown"),
                      health: (.health // "unknown"),
                      lastScrape: (.lastScrape // "unknown"),
                      lastError: (.lastError // "unknown")
                    }')
            if [ -n "$DROPPED_INGRESS_TARGET" ]; then
              echo "$DROPPED_INGRESS_TARGET"
            else
              echo "No dropped scrape target found for istio-ingressgateway"
            fi

            echo "--- Prometheus rendered scrape config checks ---"
            RENDERED_INGRESS_JOBS=$(curl -sS --fail http://localhost:9090/api/v1/status/config \
              | jq -r '.data.yaml' \
              | awk '
                  BEGIN { in_job = 0; job = ""; found = 0 }
                  /^- job_name: / { job = $0; in_job = 1 }
                  in_job && /podMonitor\/istio-system\/istio-ingressgateway/ { print job; print; found = 1 }
                  in_job && /serviceMonitor\/istio-system\/istio-ingressgateway/ { print job; print; found = 1 }
                  END { if (!found) print "No rendered podMonitor/serviceMonitor job found for istio-ingressgateway" }
                '
            )
            echo "$RENDERED_INGRESS_JOBS"

            echo "--- Prometheus rendered podMonitor job block ---"
            curl -sS --fail http://localhost:9090/api/v1/status/config \
              | jq -r '.data.yaml' \
              | awk '
                  /^- job_name: podMonitor\/istio-system\/istio-ingressgateway\/0$/ { print; show = 1; n = 0; next }
                  show && n < 40 { print; n += 1 }
                '

            echo "--- Prometheus rendered serviceMonitor job block ---"
            curl -sS --fail http://localhost:9090/api/v1/status/config \
              | jq -r '.data.yaml' \
              | awk '
                  /^- job_name: serviceMonitor\/istio-system\/istio-ingressgateway\/0$/ { print; show = 1; n = 0; next }
                  show && n < 40 { print; n += 1 }
                '

            echo "--- Prometheus exact ingressgateway PodMonitor target probe ---"
            curl -sS --fail 'http://localhost:9090/api/v1/targets?state=active' \
              | jq -c '
                  .data.activeTargets[]?
                  | select((.labels.job // "") == "istio-system/istio-ingressgateway")
                  | {job: .labels.job, scrapeUrl, health, lastScrape, lastError, pod: (.discoveredLabels.__meta_kubernetes_pod_name // "unknown")}
                ' || echo "No active target for istio-system/istio-ingressgateway"

            curl -sS --fail 'http://localhost:9090/api/v1/targets?state=dropped' \
              | jq -c '
                  .data.droppedTargets[]?
                  | select((.discoveredLabels.job // .labels.job // "") == "istio-system/istio-ingressgateway")
                  | select((.discoveredLabels.__meta_kubernetes_pod_label_app // "") == "istio-ingressgateway")
                  | {job: (.labels.job // .discoveredLabels.job // "unknown"), address: (.discoveredLabels.__address__ // "unknown"), endpointPort: (.discoveredLabels.__meta_kubernetes_pod_container_port_name // "unknown")}
                ' || echo "No dropped ingressgateway PodMonitor targets"

            echo "--- Prometheus exact frontend 15090 podMonitor probe ---"
            curl -sS --fail 'http://localhost:9090/api/v1/targets?state=active' \
              | jq -c '
                  .data.activeTargets[]?
                  | select((.discoveredLabels.__meta_kubernetes_pod_label_app // "") == "frontend")
                  | select((.discoveredLabels.__address__ // "") | endswith(":15090"))
                  | {job: .labels.job, scrapeUrl, health, lastScrape, lastError, labels: .labels, discoveredLabels: .discoveredLabels}
                ' || echo "No active 15090 frontend target found"

            curl -sS --fail 'http://localhost:9090/api/v1/targets?state=dropped' \
              | jq -c '
                  .data.droppedTargets[]?
                  | select((.discoveredLabels.__meta_kubernetes_pod_label_app // "") == "frontend")
                  | select((.discoveredLabels.__address__ // "") | endswith(":15090"))
                  | {job: (.labels.job // .discoveredLabels.job // "unknown"), scrapeUrl: (.scrapeUrl // "unknown"), health: (.health // "unknown"), lastScrape: (.lastScrape // "unknown"), lastError: (.lastError // "unknown"), labels: (.labels // {}), discoveredLabels: .discoveredLabels}
                ' || echo "No dropped 15090 frontend target found"

            echo "--- Prometheus Istio request series check ---"
            curl -sS --fail --get 'http://localhost:9090/api/v1/series' \
              --data-urlencode "match[]=istio_requests_total{reporter=\"destination\",destination_canonical_service=\"frontend\",destination_workload_namespace=\"${APP_NS}\"}" \
              --data-urlencode "match[]=istio_requests_total{reporter=\"destination\",destination_workload=~\"frontend.*\",destination_workload_namespace=\"${APP_NS}\"}" \
              | jq -r '.data[]? | @json' \
              || echo "No istio_requests_total series found for frontend"

            echo "--- Flagger request-success-rate query probe ---"
            SUCCESS_RATE_QUERY="(sum(rate(istio_requests_total{reporter=\"destination\",destination_workload_namespace=\"${APP_NS}\",destination_canonical_service=\"frontend\",request_protocol=\"http\",response_code!~\"5.*\"}[1m]))/sum(rate(istio_requests_total{reporter=\"destination\",destination_workload_namespace=\"${APP_NS}\",destination_canonical_service=\"frontend\",request_protocol=\"http\"}[1m])))*100"
            curl -sS --fail --get 'http://localhost:9090/api/v1/query' \
              --data-urlencode "query=${SUCCESS_RATE_QUERY}" \
              | jq -c '{status, resultType, value: (.data.result[0].value // ["none","no data"])}' \
              || echo "Flagger success-rate query returned no data"

            echo "--- Prometheus PodMonitor job summary ---"
            PODMONITOR_TARGETS=$(curl -sS --fail http://localhost:9090/api/v1/targets \
              | jq -c '.data.activeTargets[]? | select((.labels.job // "") | test("istio-system/istio-ingressgateway|'"${APP_NS}"'/frontend")) | {job: .labels.job, scrapeUrl, health, lastScrape, lastError}')
            if [ -n "$PODMONITOR_TARGETS" ]; then
              echo "$PODMONITOR_TARGETS"
            else
              echo "No active podMonitor targets found"
            fi

            echo "--- Prometheus PodMonitor dropped target summary ---"
            DROPPED_PODMONITOR_TARGETS=$(curl -sS --fail 'http://localhost:9090/api/v1/targets?state=dropped' \
              | jq -c '.data.droppedTargets[]? | select((.discoveredLabels.job // .labels.job // "") | test("istio-system/istio-ingressgateway|'"${APP_NS}"'/frontend")) | {job: (.labels.job // .discoveredLabels.job // "unknown"), address: (.discoveredLabels.__address__ // "unknown"), endpointPort: (.discoveredLabels.__meta_kubernetes_pod_container_port_name // "unknown")}')
            if [ -n "$DROPPED_PODMONITOR_TARGETS" ]; then
              echo "$DROPPED_PODMONITOR_TARGETS"
            else
              echo "No dropped podMonitor targets found"
            fi

            kill $PF_PID || true
            sleep 1
          else
            echo "Prometheus service monitoring-kube-prometheus-prometheus not found in monitoring namespace"
          fi

      - name: Summarize inspection results
        run: |
          echo "## Prometheus Inspection" >> "$GITHUB_STEP_SUMMARY"
          echo "Namespace inspected: ${{ inputs.namespace }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the ingressgateway scrape summary output from the job logs above." >> "$GITHUB_STEP_SUMMARY"
