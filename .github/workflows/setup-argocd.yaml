name: setup argocd
on:
  workflow_call:
    inputs:
      kubeconfig-artifact:
        description: "Name of the artifact containing the kubeconfig from a previous job"
        required: true
        type: string
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  setup-argocd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download kubeconfig from caller
        if: github.event_name == 'workflow_call'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.kubeconfig-artifact }}
          path: ~/.kube/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig for EKS
        if: github.event_name != 'workflow_call'
        run: aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: setup argocd with helm
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd --create-namespace \
            --set server.service.type=LoadBalancer

      - name: wait for argocd to become ready
        run: |
          kubectl -n argocd wait --for=condition=available deployment --all --timeout=10m
          kubectl -n argocd get pods
          kubectl -n argocd get svc

      - name: wait for argocd dashboard endpoint
        id: argocd-url
        shell: bash
        run: |
          set -euo pipefail

          URL=""
          for i in {1..60}; do
            HOSTNAME=$(kubectl -n argocd get svc argocd-server -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            IP=$(kubectl -n argocd get svc argocd-server -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)

            if [ -n "$HOSTNAME" ]; then
              URL="https://$HOSTNAME"
              break
            fi

            if [ -n "$IP" ]; then
              URL="https://$IP"
              break
            fi

            echo "Waiting for ArgoCD LoadBalancer endpoint... ($i/60)"
            sleep 10
          done

          if [ -z "$URL" ]; then
            echo "ArgoCD dashboard endpoint not ready yet. Check service events:"
            kubectl -n argocd describe svc argocd-server || true
            exit 1
          fi

          echo "dashboard_url=$URL" >> "$GITHUB_OUTPUT"
          echo "ArgoCD dashboard URL: $URL"

      - name: verify argocd applications api
        run: |
          kubectl get applications.argoproj.io -A || true

      - name: Bootstrap ArgoCD repo binding
        run: |
          kubectl apply -f argocd/root-app.yaml
          kubectl get applications.argoproj.io -A

      - name: get argocd admin password
        id: argocd
        run: |
          PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 --decode)
          echo "argocd_password=$PASSWORD" >> "$GITHUB_OUTPUT"
          echo "ArgoCD Admin Password: $PASSWORD"

      - name: summarize argocd access
        run: |
          echo "ArgoCD namespace: argocd" >> "$GITHUB_STEP_SUMMARY"
          echo "ArgoCD dashboard URL: ${{ steps.argocd-url.outputs.dashboard_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Login user: admin" >> "$GITHUB_STEP_SUMMARY"
          echo "ArgoCD admin password: ${{ steps.argocd.outputs.argocd_password }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ArgoCD root app: microservices-bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "ArgoCD now tracks the repo through argocd/root-app.yaml and argocd/apps/onlineboutique-helm-app.yaml." >> "$GITHUB_STEP_SUMMARY"
