name: Deploy to AWS EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you deploying?"
        required: false
        default: "Manual deployment"

jobs:
  provision:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-aws]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      APP_NAMESPACE: onlineboutique

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # Azure Login (legacy, retained for fallback)
    # - name: Azure Login
    #   uses: azure/login@v1
    #   with:
    #     creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Show AWS target context
      run: |
        echo "AWS region: $AWS_REGION"
        echo "EKS cluster: $EKS_CLUSTER_NAME"
        aws sts get-caller-identity
        aws eks list-clusters --region "$AWS_REGION"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Init (S3 Backend)
      working-directory: ./terraform
      run: |
        terraform init \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
          -backend-config="region=${{ env.AWS_REGION }}"

    # Terraform Init (Azure backend legacy, retained for fallback)
    # - name: Terraform Init
    #   working-directory: ./terraform
    #   run: |
    #     terraform init \
    #       -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
    #       -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE }}" \
    #       -backend-config="container_name=tfstate" \
    #       -backend-config="key=terraform.tfstate"

    - name: Terraform Apply
      working-directory: ./terraform
      run: terraform apply -auto-approve

    - name: Update kubeconfig for EKS
      run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

    - name: Show kubectl context
      run: |
        kubectl config current-context
        kubectl get nodes -o wide

    # Get AKS Credentials (legacy, retained for fallback)
    # - name: Get AKS Credentials
    #   run: az aks get-credentials --resource-group microservices-demo-rg --name microservices-aks --overwrite-existing

    - name: Save kubeconfig for downstream jobs
      uses: actions/upload-artifact@v4
      with:
        name: kubeconfig
        path: ~/.kube/config

  setup-argocd:
    needs:
      - setup-istio
      - setup-flagger
    uses: ./.github/workflows/setup-argocd.yaml
    permissions:
      id-token: write
      contents: read
    with:
      kubeconfig-artifact: kubeconfig
    secrets: inherit

  setup-istio:
    needs: provision
    uses: ./.github/workflows/setup-istio.yaml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  setup-monitoring:
    needs: provision
    uses: ./.github/workflows/setup-monitoring.yaml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  setup-flagger:
    needs:
      - setup-istio
      - setup-monitoring
    uses: ./.github/workflows/setup-flagger.yaml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  deploy-microservices:
    needs:
      - setup-argocd
      - setup-monitoring
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig for EKS
      run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

    - name: Wait for ArgoCD applications
      shell: bash
      run: |
        set -euo pipefail

        wait_for_app() {
          local app_name="$1"
          for i in {1..60}; do
            SYNC_STATUS=$(kubectl -n argocd get application "$app_name" -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            HEALTH_STATUS=$(kubectl -n argocd get application "$app_name" -o jsonpath='{.status.health.status}' 2>/dev/null || true)

            if [ "$SYNC_STATUS" = "Synced" ] && [ "$HEALTH_STATUS" = "Healthy" ]; then
              echo "$app_name is Synced and Healthy"
              return 0
            fi

            echo "Waiting for ArgoCD app $app_name... ($i/60) sync=$SYNC_STATUS health=$HEALTH_STATUS"
            sleep 10
          done

          echo "Timed out waiting for ArgoCD app $app_name"
          kubectl -n argocd get applications.argoproj.io
          exit 1
        }

        wait_for_app microservices-bootstrap
        wait_for_app onlineboutique-helm

    - name: Verify resources after deploy
      run: |
        kubectl get applications.argoproj.io -A
        kubectl get ns
        kubectl get deploy,svc -A

    - name: Wait for Istio frontend endpoint
      id: frontend
      shell: bash
      run: |
        set -euo pipefail

        URL=""
        for i in {1..60}; do
          HOSTNAME=$(kubectl -n istio-system get svc istio-ingressgateway -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          IP=$(kubectl -n istio-system get svc istio-ingressgateway -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)

          if [ -n "$HOSTNAME" ]; then
            URL="http://$HOSTNAME"
            break
          fi

          if [ -n "$IP" ]; then
            URL="http://$IP"
            break
          fi

          echo "Waiting for Istio ingressgateway endpoint... ($i/60)"
          sleep 10
        done

        if [ -z "$URL" ]; then
          echo "Istio frontend endpoint not ready yet. Check service events:"
          kubectl -n istio-system describe svc istio-ingressgateway || true
          exit 1
        fi

        echo "frontend_url=$URL" >> "$GITHUB_OUTPUT"
        echo "Frontend URL: $URL"

    - name: Show frontend URL
      run: |
        echo "Frontend URL: ${{ steps.frontend.outputs.frontend_url }}"
        echo "## Deployment Result" >> "$GITHUB_STEP_SUMMARY"
        echo "Frontend URL: ${{ steps.frontend.outputs.frontend_url }}" >> "$GITHUB_STEP_SUMMARY"
