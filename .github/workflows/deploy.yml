name: Deploy to AWS EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you deploying?"
        required: false
        default: "Manual deployment"

jobs:
  # ------------------------------------------------------------------
  # 1. Provision infrastructure with Terraform
  # ------------------------------------------------------------------
  provision:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-aws]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Show AWS target context
      run: |
        echo "AWS region: $AWS_REGION"
        echo "EKS cluster: $EKS_CLUSTER_NAME"
        aws sts get-caller-identity
        aws eks list-clusters --region "$AWS_REGION"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Init (S3 Backend)
      working-directory: ./terraform
      run: |
        terraform init \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
          -backend-config="region=${{ env.AWS_REGION }}"

    - name: Terraform Apply
      working-directory: ./terraform
      run: terraform apply -auto-approve

    - name: Update kubeconfig for EKS
      run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

    - name: Show kubectl context
      run: |
        kubectl config current-context
        kubectl get nodes -o wide

    - name: Save kubeconfig for downstream jobs
      uses: actions/upload-artifact@v4
      with:
        name: kubeconfig
        path: ~/.kube/config

  # ------------------------------------------------------------------
  # 2. Install / configure ArgoCD (reusable workflow)
  # ------------------------------------------------------------------
  setup-argocd:
    needs: provision
    uses: ./.github/workflows/setup-argocd.yaml
    permissions:
      id-token: write
      contents: read
    with:
      kubeconfig-artifact: kubeconfig
    secrets: inherit

  # ------------------------------------------------------------------
  # 3. Deploy microservices to the cluster
  # ------------------------------------------------------------------
  deploy-microservices:
    needs: setup-argocd
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Download kubeconfig from provision step
      uses: actions/download-artifact@v4
      with:
        name: kubeconfig
        path: ~/.kube/

    - name: Deploy Microservices to EKS
      run: kubectl apply -f release/kubernetes-manifests.yaml

    - name: Verify resources after deploy
      run: |
        kubectl get ns
        kubectl get deploy,svc -A

    - name: Wait for frontend endpoint
      id: frontend
      shell: bash
      run: |
        set -euo pipefail

        URL=""
        for i in {1..60}; do
          HOSTNAME=$(kubectl get svc frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          IP=$(kubectl get svc frontend-external -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)

          if [ -n "$HOSTNAME" ]; then
            URL="http://$HOSTNAME"
            break
          fi

          if [ -n "$IP" ]; then
            URL="http://$IP"
            break
          fi

          echo "Waiting for frontend LoadBalancer endpoint... ($i/60)"
          sleep 10
        done

        if [ -z "$URL" ]; then
          echo "Frontend endpoint not ready yet. Check service events:"
          kubectl describe svc frontend-external || true
          exit 1
        fi

        echo "frontend_url=$URL" >> "$GITHUB_OUTPUT"
        echo "Frontend URL: $URL"

    - name: Show frontend URL
      run: |
        echo "Frontend URL: ${{ steps.frontend.outputs.frontend_url }}"
        echo "## Deployment Result" >> "$GITHUB_STEP_SUMMARY"
        echo "Frontend URL: ${{ steps.frontend.outputs.frontend_url }}" >> "$GITHUB_STEP_SUMMARY"
