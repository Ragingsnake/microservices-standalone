{{- if .Values.serviceMeshIstio.create }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app: {{ .Values.frontend.name }}
  podMetricsEndpoints:
    - portNumber: 15090
      path: /stats/prometheus
      interval: 15s
{{- end }}