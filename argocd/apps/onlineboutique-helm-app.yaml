apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onlineboutique-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ragingsnake/microservices-standalone
    targetRevision: main
    path: helm-chart
    helm:
      releaseName: onlineboutique
      parameters:
        - name: images.repository
          value: docker.io/ragingsnake
        - name: images.tag
          value: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: onlineboutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
