apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: frontend
  namespace: onlineboutique
spec:
  provider: istio
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  service:
    port: 80
  progressDeadlineSeconds: 60
  analysis:
    interval: 1m
    threshold: 10
    maxWeight: 50
    stepWeight: 10
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: 99
        interval: 1m
      - name: request-duration
        thresholdRange:
          max: 500
        interval: 1m
  trafficRouting:
    istio:
      virtualService:
        name: frontend
        gateways:
          - onlineboutique/frontend-gateway
        hosts:
          - "*"
